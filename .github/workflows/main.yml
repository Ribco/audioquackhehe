name: AudioQuack

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install system deps
        run: |
          # Install Homebrew if missing
          which brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

          # Add brew bin dirs to PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/sbin" >> $GITHUB_PATH

          # Install required tools
          brew update
          brew install wireguard-tools curl

      - name: Write WireGuard config
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Bring up VPN
        run: sudo wg-quick up /etc/wireguard/wg0.conf

      - name: Verify VPN public IP
        run: |
          sleep 5
          echo "Public IP via curl (should reflect VPN exit):"
          curl ifconfig.me

      - name: Check issues
       uses: actions/configure-pages@v4

      - name: Install Node & Python deps
        run: |
          npm install
          pip install -U yt-dlp discord.py spotify-dlp

      - name: Write cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Debug cookies.txt
        run: |
          wc -l cookies.txt
          head -n 3 cookies.txt

      - name: Start bot
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOKIES_FILE: cookies.txt
          YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
          YOUTUBE_VISITOR_DATA: ${{ secrets.YOUTUBE_VISITOR_DATA }}
          SPOTIFY_ACCESS_TOKEN: ${{ env.SPOTIFY_ACCESS_TOKEN }}

      - name: Upload cookies artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookies
          path: artifact/cookies.txt

      - name: Bring down VPN
        if: always()
        run: sudo wg-quick down /etc/wireguard/wg0.conf
