name: AudioQuack

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y wireguard curl

      - name: Write WireGuard config
        run: |
          mkdir -p /etc/wireguard
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Bring up VPN
        run: |
          sudo wg-quick up /etc/wireguard/wg0.conf

      - name: Verify VPN public IP
        run: |
          sleep 5
          echo "Public IP before VPN check:"
          curl ifconfig.me

      - name: Install dependencies
        run: npm install

      - name: Install yt-dlp
        run: pip install -U yt-dlp && pip install -U discord.py spotify-dlp

      - name: Write YouTube cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Prepare cookies artifact
        run: |
          mkdir -p artifact
          cp cookies.txt artifact/cookies.txt

      - name: Debug cookies.txt
        run: |
          wc -l cookies.txt
          head -3 cookies.txt

      - name: Start bot
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOKIES_FILE: cookies.txt
          YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
          YOUTUBE_VISITOR_DATA: ${{ secrets.YOUTUBE_VISITOR_DATA }}

      - name: Upload cookies artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookies
          path: artifact/cookies.txt

      - name: Bring down VPN
        if: always()
        run: sudo wg-quick down /etc/wireguard/wg0.conf
