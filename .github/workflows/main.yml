name: AudioQuack

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: macos-latest-large

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install system dependencies on macOS
        run: |
          # Install Homebrew if not already present
          which brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

          # Add Homebrew to PATH for this session
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $GITHUB_ENV
          eval "$(/opt/homebrew/bin/brew shellenv)"

          # Update brew and install WireGuard tools + curl
          brew update
          brew install wireguard-tools curl
        timeout-minutes: 10

      - name: Write WireGuard config
        run: |
          sudo mkdir -p /usr/local/etc/wireguard
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /usr/local/etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /usr/local/etc/wireguard/wg0.conf

      - name: Bring up WireGuard VPN
        run: |
          sudo wg-quick up /usr/local/etc/wireguard/wg0.conf

      - name: Verify VPN public IP
        run: |
          sleep 5
          echo "Public IP via curl (should reflect VPN exit):"
          curl ifconfig.me

      - name: Install Node.js dependencies
        run: npm install

      - name: Install Python tools
        run: |
          pip install -U yt-dlp
          pip install -U discord.py spotify-dlp

      - name: Write and debug YouTube cookies
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          wc -l cookies.txt
          head -n 3 cookies.txt

      - name: Prepare cookies artifact
        run: |
          mkdir -p artifact
          cp cookies.txt artifact/

      - name: Start bot
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOKIES_FILE: cookies.txt
          YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
          YOUTUBE_VISITOR_DATA: ${{ secrets.YOUTUBE_VISITOR_DATA }}

      - name: Upload cookies artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookies
          path: artifact/cookies.txt

      - name: Bring down VPN
        if: always()
        run: sudo wg-quick down /usr/local/etc/wireguard/wg0.conf
