name: AudioQuack

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:

  setup:
    name: ⚙️ Setup & Build Environment
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          export YOUTUBE_DL_SKIP_DOWNLOAD=true

          if [ -f package-lock.json ]; then
            echo "[INFO] Using npm ci"
            npm ci
          else
            echo "[WARN] No lockfile → using npm install"
            npm install
          fi

          pip install -U yt-dlp discord.py spotify-dlp

      - name: 🍪 Create Cookies Artifact
        run: |
          mkdir -p artifact
          printf '%s\n' "${{ secrets.YOUTUBE_COOKIES }}" > artifact/cookies.txt

      - name: 📤 Upload Cookies
        uses: actions/upload-artifact@v4
        with:
          name: cookies
          path: artifact/cookies.txt

  vpn:
    name: 🔐 VPN Tunnel Setup
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: 📥 Download Cookies
        uses: actions/download-artifact@v4
        with:
          name: cookies
          path: .

      - name: 🔧 Install WireGuard
        run: |
          sudo apt update
          sudo apt install -y wireguard curl

      - name: 📝 Configure WireGuard
        run: |
          sudo mkdir -p /etc/wireguard
          printf '%s\n' "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: 🚀 Start VPN
        run: sudo wg-quick up wg0

      - name: 🌍 Verify VPN IP
        run: |
          sleep 5
          echo "[INFO] Current IP:"
          curl ifconfig.me || true

  bot:
    name: 🤖 Launch AudioQuack Bot
    runs-on: ubuntu-latest
    needs: [setup, vpn]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Download Cookies
        uses: actions/download-artifact@v4
        with:
          name: cookies
          path: .

      - name: 📦 Install Runtime Dependencies
        run: |
          export YOUTUBE_DL_SKIP_DOWNLOAD=true

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: ▶️ Start Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOKIES_FILE: cookies.txt
          YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
          YOUTUBE_VISITOR_DATA: ${{ secrets.YOUTUBE_VISITOR_DATA }}
          SPOTIFY_ACCESS_TOKEN: ${{ secrets.SPOTIFY_ACCESS_TOKEN }}
        run: |
          echo "[DEBUG] Starting AudioQuack..."
          node index.js

      - name: 🛑 Cleanup VPN
        if: always()
        run: sudo wg-quick down wg0 || true
