name: AudioQuack

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install system deps
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          if [ -d /opt/homebrew/bin ]; then
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
            echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"
          elif [ -d /usr/local/bin ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
            echo "/usr/local/sbin" >> "$GITHUB_PATH"
          fi

          brew update
          brew install wireguard-tools curl || true

      - name: Write WireGuard config
        shell: bash
        run: |
          sudo mkdir -p /etc/wireguard
          printf '%s\n' "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Bring up VPN
        run: sudo wg-quick up wg0

      - name: Verify VPN public IP
        run: |
          sleep 5
          echo "Public IP via curl (should reflect VPN exit):"
          curl ifconfig.me

      - name: Install Node & Python deps
        run: |
          npm install
          python3 -m pip install -U yt-dlp discord.py spotify-dlp

      - name: Write cookies
        shell: bash
        run: |
          mkdir -p artifact
          printf '%s\n' "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          cp cookies.txt artifact/cookies.txt

      - name: Debug cookies.txt
        run: |
          wc -l cookies.txt
          head -n 3 cookies.txt

      - name: Start bot
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOKIES_FILE: cookies.txt
          YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
          YOUTUBE_VISITOR_DATA: ${{ secrets.YOUTUBE_VISITOR_DATA }}
          SPOTIFY_ACCESS_TOKEN: ${{ secrets.SPOTIFY_ACCESS_TOKEN }}

      - name: Upload cookies artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookies
          path: artifact/cookies.txt

      - name: Bring down VPN
        if: always()
        run: sudo wg-quick down wg0
