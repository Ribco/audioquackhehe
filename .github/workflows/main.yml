name: AudioQuack

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:

  prep_ubuntu:
    name: Prepare on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Ubuntu)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile found → using npm ci"
            npm ci
          else
            echo "No lockfile → using npm install"
            npm install
          fi
          python3 -m pip install -U yt-dlp discord.py spotify-dlp

      - name: Write cookies file
        shell: bash
        run: |
          mkdir -p artifact
          printf '%s\n' "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          cp cookies.txt artifact/cookies.txt

      - name: Debug cookies
        shell: bash
        run: |
          echo "Cookies lines:"
          wc -l cookies.txt
          head -n 5 cookies.txt

      - name: Upload cookies to artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookies
          path: artifact/cookies.txt

  macos_bot:
    name: Start Bot on macOS
    needs: prep_ubuntu
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download cookies artifact
        uses: actions/download-artifact@v4
        with:
          name: cookies
          path: .

      - name: Install Homebrew (macOS) & system deps
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          if [ -d /opt/homebrew/bin ]; then
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
            echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"
          elif [ -d /usr/local/bin ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
            echo "/usr/local/sbin" >> "$GITHUB_PATH"
          fi

          brew update
          brew install wireguard-tools || true

      - name: Write WireGuard config
        run: |
          sudo mkdir -p /etc/wireguard
          printf '%s\n' "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Bring up VPN
        run: sudo wg-quick up wg0

      - name: Verify public IP
        run: |
          sleep 5
          echo "VPN exit IP:"
          curl ifconfig.me || true

      - name: Install dependencies on macOS
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile found → using npm ci"
            npm ci
          else
            echo "No lockfile → using npm install"
            npm install
          fi
          python3 -m pip install -U yt-dlp discord.py spotify-dlp

      - name: Start the bot
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOKIES_FILE: cookies.txt
          YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
          YOUTUBE_VISITOR_DATA: ${{ secrets.YOUTUBE_VISITOR_DATA }}
          SPOTIFY_ACCESS_TOKEN: ${{ secrets.SPOTIFY_ACCESS_TOKEN }}
        run: |
          node index.js

      - name: Bring down VPN
        if: always()
        run: sudo wg-quick down wg0
